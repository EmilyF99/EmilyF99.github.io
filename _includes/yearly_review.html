<!-- Clients Aside -->
  <section id="clients" class="bg-light-gray">
        <div class="container">
            <div class="row">
                <div class="col-lg-12 text-center">
                    <h2 class="section-heading">Yearly Review</h2>
                    <br>
                </div>
            </div>
                <div class="row">
                    {% for video in site.videos %}
                        <div class="col-lg-12 portfolio-item">
                            <div class="portfolio-caption text-center">
                                <h4>{{ video.title }}</h4>
                                <p class="text-muted">{{ video.subtitle }}</p>
                            </div>

                            {% if video.thumbnail and video.filename %}
                                <div class="video-preview text-center">
                                    <img src="img/thumbnails/{{ video.thumbnail }}" alt="{{ video.title }}"
                                         class="img-responsive" style="cursor:pointer;"
                                         onclick="playVideo(this, 'videos/{{ video.filename }}')">
                                </div>
                            {% endif %}

                            <br><br>
                        </div>
                    {% endfor %}
                </div>

    <script>
        function playVideo(imgElement, videoSrc) {
            const container = imgElement.parentElement;
            const video = document.createElement('video');
            video.setAttribute('controls', '');
            video.setAttribute('autoplay', '');
            video.setAttribute('width', '100%');

            const source = document.createElement('source');
            source.setAttribute('src', videoSrc);
            source.setAttribute('type', 'video/mp4');

            video.appendChild(source);
            container.innerHTML = '';
            container.appendChild(video);
        }
    </script>
</section>
